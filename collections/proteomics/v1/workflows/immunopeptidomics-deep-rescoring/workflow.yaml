    generate_rt_features:
    - tsv:psm-retention-time-features
    generate_spectral_features:
    - tsv:psm-spectral-angle-features
verification:
  final_outputs:
  - path: deeprescore_psm_final.tsv
    type: file
  - path: deeprescore_pep_final.tsv
    type: file
provenance:
