evidence_spans:
- RF pulse, gradient, ADC and trigger events can be easily defined and are written to a pulseq-file
- Originally intended as a hardware independent MRI sequence prototyping framework, Pulseq allows for rapid and simple sequence definitions
- The pulseq-file thus contains the full definition of all sequence objects
- Originally intended as a hardware independent MRI sequence prototyping framework, Pulseq allows for rapid and simple sequence definitions from within MATLAB
- we propose a CEST definition standard using the open Pulseq format for a shareable, simple, and exact definition of CEST protocols
