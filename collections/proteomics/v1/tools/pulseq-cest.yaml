evidence_spans:
- an open-source Bloch-McConnell simulation to test and optimize CEST preparation periods in silico
- an application was written in C++ that loops through the pulseq-files, performs Bloch-McConnell simulations for the respective sequence events37, and returns the current magnetization vector
- With Pulseq-CEST, we provide a straightforward approach to standardize, share, simulate, and measure different CEST preparation schemes
- Example codes to create different CEST preparation periods in MATLAB and python are provided at the projects' website (https://pulseq-cest.github.io)
