name: Domain content gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  released-collections:
    name: ${{ matrix.collection.collection_path }}
    strategy:
      fail-fast: false
      matrix:
        collection:
            - domain: proteomics
              collection_path: collections/proteomics/v1
              receipts_path: "receipts/c0107b2c545e"
    # Pin the tooling commit recorded in collections.yaml for the release.
    # Bump this full commit SHA deliberately when adopting newer gate tooling.
    uses: HolobiomicsLab/asb-skill-collections/.github/workflows/domain-gates.yml@a03312fe8425b6c70075651c40d263252059bd23
    with:
      domain: ${{ matrix.collection.domain }}
      collection_path: ${{ matrix.collection.collection_path }}
      receipts_path: ${{ matrix.collection.receipts_path }}
      strict: true
      edam_strict: true
